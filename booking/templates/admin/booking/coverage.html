{% extends "admin/base_site.html" %}
{% block content %}
<p>{{ rows|length }} tier contexts. Every tier always has exactly one rule.</p>
<table>
  <thead>
    <tr><th>Organization</th><th>Tier</th><th>Winner</th></tr>
  </thead>
  <tbody>
    {% for row in rows %}
    <tr>
      <td>{{ row.organization }}</td>
      <td>{{ row.tier }}</td>
      <td>{{ row.rule }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
