[project]
name = "bookr"
version = "0.1.0"
description = "Multi-tenant gym management platform (classes, bookings, credit passes, aggregators, door access)"
readme = "README.md"
authors = [
    { name = "Kevin Gathuku", email = "kevgathuku@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.2,<7",
    "django-extensions>=4.1",
    "ipython>=9.17.1",
    "psycopg[binary]",
]

# [project.scripts]
# bookr = "bookr:main"

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["RUF012"]

[tool.ruff.format]
exclude = ["*/migrations/*.py"]


[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["."]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "faker>=40.43.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
]
