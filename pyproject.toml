[project]
name = "bookr"
version = "0.1.0"
description = "Multi-tenant gym management platform (classes, bookings, credit passes, aggregators, door access)"
readme = "README.md"
authors = [
    { name = "Kevin Gathuku", email = "kevgathuku@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "dj-database-url>=3.1.2",
    "django>=6.1.2,<7",
    "django-extensions>=4.1",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "ipython>=9.17.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]",
    "python-dateutil>=3.0.0",
    "redis>=8.1.0",
    "tzdata>=2026.5",
    "whitenoise>=6.12.0",
]

# [project.scripts]
# bookr = "bookr:main"

[tool.ruff]
# Installer-dropped agent scaffolding is not project source.
exclude = [
    ".agent",
    ".claude",
    ".codex",
    ".cursor",
    "graft",
    "assets",
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["RUF012"]

[tool.ruff.format]
exclude = ["*/migrations/*.py"]


[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
markers = [
    "smoke: per-commit end-to-end smoke (live server, no sleeps)",
    "e2e: full nightly/pre-release suite (needs worker, mailpit, frontend)",
]

[tool.coverage.run]
source = ["booking", "passes", "scheduling", "organizations", "access", "aggregators"]
omit = ["*/migrations/*", "*/admin.py", "*/apps.py", "*/tests.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "factory-boy>=3.3.3",
    "faker>=40.43.0",
    "flake8>=7.4.1",
    "freezegun>=1.5.5",
    "ipdb>=0.13.13",
    "mypy>=2.4.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.10.0",
    "pytest-xdist>=3.8.0",
    "requests>=2.34.2",
    "ruff>=0.17.2",
    "types-django-filter>=26.2.0.20261005",
    "types-python-dateutil>=2.9.0.20261029",
    "wemake-python-styleguide>=1.8.1",
]
