[project]
name = "bookr"
version = "0.1.0"
description = "Multi-tenant gym management platform (classes, bookings, credit passes, aggregators, door access)"
readme = "README.md"
authors = [
    { name = "Kevin Gathuku", email = "kevgathuku@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "dj-database-url>=3.1.2",
    "django>=6.1.2,<7",
    "django-extensions>=4.1",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "ipython>=9.17.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]",
    "redis>=8.1.0",
]

# [project.scripts]
# bookr = "bookr:main"

[tool.ruff]
# Installer-dropped agent scaffolding is not project source.
exclude = [
    ".agent",
    ".claude",
    ".codex",
    ".cursor",
    "graft",
    "assets",
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["RUF012"]

[tool.ruff.format]
exclude = ["*/migrations/*.py"]


[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "faker>=40.43.0",
    "flake8>=7.4.1",
    "freezegun>=1.5.5",
    "mypy>=2.4.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
    "wemake-python-styleguide>=1.8.1",
]
