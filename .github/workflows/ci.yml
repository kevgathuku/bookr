name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: bookr
          POSTGRES_PASSWORD: bookr
          POSTGRES_DB: bookr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookr -d bookr"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://bookr:bookr@localhost:5432/bookr
      SECRET_KEY: ci-only-insecure-key
      DEBUG: "True"

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - run: uv sync --frozen

      - run: uv run ruff check .
      - run: uv run ruff format --check .

      - run: uv run python manage.py check

      - run: uv run pytest -q
