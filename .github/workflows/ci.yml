name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: bookr
          POSTGRES_PASSWORD: bookr
          POSTGRES_DB: bookr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookr -d bookr"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://bookr:bookr@localhost:5432/bookr
      SECRET_KEY: ci-only-insecure-key
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: config.settings.test

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - run: uv sync --frozen

      - run: uv run ruff check .
      - run: uv run ruff format --check .

      - run: uv run python manage.py check

      # Unit suite runs parallel (per-worker test DBs via pytest-django);
      # live-server smoke specs stay serial (excluded from -n auto).
      # Coverage collects in the parallel step, reports + floors on the
      # combined total after the serial smoke step appends.
      - run: uv run pytest -q -n auto -m "not e2e and not smoke" --cov --cov-report=
      - run: uv run pytest tests/e2e -q -m "smoke" --cov --cov-append --cov-report=term-missing --cov-fail-under=90

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
